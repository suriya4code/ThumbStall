<title>Roadmap. v0.1 shipped: Pause screen with breathing countdown, App picker, escalation, session budget, Snooze and costly override, Stats dashboard, Onboarding flow. Next: Feed blocking for Reels and Shorts, Daily time limits, Schedules for work hours and bedtime, F-Droid and IzzyOnDroid</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1c15"/><stop offset="1" stop-color="#13140f"/></linearGradient><linearGradient id="lane" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a6b2e" stop-opacity=".32"/><stop offset="1" stop-color="#5a6b2e" stop-opacity=".06"/></linearGradient></defs>
<style>
@font-face{font-family:TSMB;src:url(data:font/woff2;base64,) format('woff2');font-weight:700;}
@font-face{font-family:TSI;src:url(data:font/woff2;base64,) format('woff2');font-weight:400;}

.ck { stroke-dasharray: 20; stroke-dashoffset: 0; animation: ck 9s ease-out infinite backwards; }
@keyframes ck { 0%, 4% { stroke-dashoffset: 20; } 10%, 94% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 20; } }
.dotf { transform-box: fill-box; transform-origin: center; animation: dotf 9s ease-out infinite backwards; }
@keyframes dotf { 0%, 2% { transform: scale(0); } 7%, 94% { transform: scale(1); } 100% { transform: scale(0); } }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
.track { stroke-dasharray: 6 8; animation: march 1.2s linear infinite; }
@keyframes march { to { stroke-dashoffset: -14; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
