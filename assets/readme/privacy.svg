<svg xmlns="http://www.w3.org/2000/svg" width="960" height="333" viewBox="0 0 960 333" role="img" aria-label="AndroidManifest permissions: usage stats, overlay, foreground service, notifications, boot completed and exact alarms. INTERNET is never requested.">
<title>AndroidManifest permissions: usage stats, overlay, foreground service, notifications, boot completed and exact alarms. INTERNET is never requested.</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1c15"/><stop offset="1" stop-color="#13140f"/></linearGradient></defs>
<style>
@font-face{font-family:TSM;src:url(data:font/woff2;base64,) format('woff2');font-weight:500;}
@font-face{font-family:TSMB;src:url(data:font/woff2;base64,) format('woff2');font-weight:700;}

.ln { animation: ln 10s infinite backwards; }
@keyframes ln { 0% { opacity: 0; transform: translateX(-6px); } 4%, 94% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.st { stroke-dasharray: 100; stroke-dashoffset: 0; animation: st 10s cubic-bezier(.65,0,.35,1) infinite backwards; }
@keyframes st { 0%, 48% { stroke-dashoffset: 100; } 60%, 94% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 100; } }
.no { animation: no 10s infinite backwards; }
@keyframes no { 0%, 58% { opacity: 0; } 64%, 94% { opacity: 1; } 100% { opacity: 0; } }
.dimx { opacity: .45; animation: dimx 10s infinite backwards; }
@keyframes dimx { 0%, 50% { opacity: 1; } 60%, 94% { opacity: .45; } 100% { opacity: 1; } }
.cur { animation: cur 1s steps(1) infinite; } @keyframes cur { 50% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="958" height="331" rx="18" fill="url(#bg)" stroke="rgba(197,204,158,.18)"/>
<rect x="24" y="24" width="912" height="285" rx="16" fill="#0f100c" stroke="rgba(197,204,158,.26)"/>
<path d="M24 64 V40 a16 16 0 0 1 16 -16 H920 a16 16 0 0 1 16 16 V64 Z" fill="#171812"/><line x1="24" y1="64" x2="936" y2="64" stroke="rgba(197,204,158,.14)"/>
<circle cx="46" cy="44" r="5.5" fill="#34372b"/>
<circle cx="64" cy="44" r="5.5" fill="#34372b"/>
<circle cx="82" cy="44" r="5.5" fill="#34372b"/>
<text x="112.0" y="48.5" font-family="TSM" font-size="12.5" fill="#9a9e8c">AndroidManifest.xml</text>
<text x="48.0" y="96.0" font-family="TSM" font-size="13.5" fill="#6c705f" class="ln" style="animation-delay:0s">&lt;!-- everything ThumbStall asks for, and why --&gt;</text>
<g class="ln" style="animation-delay:0.25s">
<text x="48" y="123" font-family="TSM" font-size="13.5"><tspan fill="#8e9a6a">&lt;uses-permission </tspan><tspan fill="#c5cc9e">name</tspan><tspan fill="#d8dbc9">=</tspan><tspan fill="#e3c590">"PACKAGE_USAGE_STATS"</tspan><tspan fill="#8e9a6a">/&gt;</tspan></text>
<text x="560.0" y="123.0" font-family="TSM" font-size="13.5" fill="#6c705f">which app just opened</text>
</g>
<g class="ln" style="animation-delay:0.60s">
<text x="48" y="150" font-family="TSM" font-size="13.5"><tspan fill="#8e9a6a">&lt;uses-permission </tspan><tspan fill="#c5cc9e">name</tspan><tspan fill="#d8dbc9">=</tspan><tspan fill="#e3c590">"SYSTEM_ALERT_WINDOW"</tspan><tspan fill="#8e9a6a">/&gt;</tspan></text>
<text x="560.0" y="150.0" font-family="TSM" font-size="13.5" fill="#6c705f">show the pause on top</text>
</g>
<g class="ln" style="animation-delay:0.95s">
<text x="48" y="177" font-family="TSM" font-size="13.5"><tspan fill="#8e9a6a">&lt;uses-permission </tspan><tspan fill="#c5cc9e">name</tspan><tspan fill="#d8dbc9">=</tspan><tspan fill="#e3c590">"FOREGROUND_SERVICE"</tspan><tspan fill="#8e9a6a">/&gt;</tspan></text>
<text x="560.0" y="177.0" font-family="TSM" font-size="13.5" fill="#6c705f">keep watching reliably</text>
</g>
<g class="ln" style="animation-delay:1.30s">
<text x="48" y="204" font-family="TSM" font-size="13.5"><tspan fill="#8e9a6a">&lt;uses-permission </tspan><tspan fill="#c5cc9e">name</tspan><tspan fill="#d8dbc9">=</tspan><tspan fill="#e3c590">"POST_NOTIFICATIONS"</tspan><tspan fill="#8e9a6a">/&gt;</tspan></text>
<text x="560.0" y="204.0" font-family="TSM" font-size="13.5" fill="#6c705f">“protection is on”</text>
</g>
<g class="ln" style="animation-delay:1.65s">
<text x="48" y="231" font-family="TSM" font-size="13.5"><tspan fill="#8e9a6a">&lt;uses-permission </tspan><tspan fill="#c5cc9e">name</tspan><tspan fill="#d8dbc9">=</tspan><tspan fill="#e3c590">"RECEIVE_BOOT_COMPLETED"</tspan><tspan fill="#8e9a6a">/&gt;</tspan></text>
<text x="560.0" y="231.0" font-family="TSM" font-size="13.5" fill="#6c705f">restart after reboot</text>
</g>
<g class="ln" style="animation-delay:2.00s">
<text x="48" y="258" font-family="TSM" font-size="13.5"><tspan fill="#8e9a6a">&lt;uses-permission </tspan><tspan fill="#c5cc9e">name</tspan><tspan fill="#d8dbc9">=</tspan><tspan fill="#e3c590">"SCHEDULE_EXACT_ALARM"</tspan><tspan fill="#8e9a6a">/&gt;</tspan></text>
<text x="560.0" y="258.0" font-family="TSM" font-size="13.5" fill="#6c705f">end a snooze on time</text>
</g>
<g class="ln" style="animation-delay:2.35s"><g class="dimx">
<text x="48" y="285" font-family="TSM" font-size="13.5"><tspan fill="#8e9a6a">&lt;uses-permission </tspan><tspan fill="#c5cc9e">name</tspan><tspan fill="#d8dbc9">=</tspan><tspan fill="#e3c590">"INTERNET"</tspan><tspan fill="#8e9a6a">/&gt;</tspan></text>
</g>
<line x1="44" y1="280.5" x2="327.4" y2="280.5" stroke="#c2622d" stroke-width="2.4" stroke-linecap="round" pathLength="100" class="st"/>
</g>
<text x="560.0" y="285.0" font-family="TSMB" font-size="13.5" fill="#c2622d" class="no">never requested</text>
<rect x="687.5" y="273" width="8" height="15" fill="#c2622d" class="no cur"/>
</svg>
