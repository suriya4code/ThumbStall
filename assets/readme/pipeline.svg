<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-label="Anatomy of a ThumbStall pause: app opens, essentials pass, your rules, OverlayGate, PauseRules escalation, breathing pause">
<title>Anatomy of a ThumbStall pause: app opens, essentials pass, your rules, OverlayGate, PauseRules escalation, breathing pause</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1c15"/><stop offset="1" stop-color="#13140f"/></linearGradient><linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="860" y2="0"><stop offset="0" stop-color="#5a6b2e"/><stop offset=".6" stop-color="#c5cc9e"/><stop offset="1" stop-color="#f1f2e8"/></linearGradient><radialGradient id="gw"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#c5cc9e"/><stop offset="1" stop-color="#c5cc9e" stop-opacity="0"/></radialGradient></defs>
<style>
@font-face{font-family:TSMB;src:url(data:font/woff2;base64,) format('woff2');font-weight:700;}
@font-face{font-family:TSB;src:url(data:font/woff2;base64,) format('woff2');font-weight:800;}
@font-face{font-family:TSI;src:url(data:font/woff2;base64,) format('woff2');font-weight:400;}
@font-face{font-family:TSM;src:url(data:font/woff2;base64,) format('woff2');font-weight:500;}

.lit { fill: none; stroke: #c5cc9e; stroke-width: 2.2; opacity: 0; animation: lit 7s infinite; }
@keyframes lit { 0%, 3% { opacity: 0; } 7%, 62% { opacity: 1; } 78%, 100% { opacity: 0; } }
.breath { transform-box: fill-box; transform-origin: center; animation: breath 7s infinite; opacity: 0; }
@keyframes breath { 0%, 36% { opacity: 0; transform: scale(1); } 44% { opacity: 1; transform: scale(1); } 58% { transform: scale(1.55); opacity: .9; } 72% { transform: scale(1.05); opacity: .6; } 84%, 100% { transform: scale(1); opacity: 0; } }
.flow { stroke-dasharray: 760; stroke-dashoffset: 760; animation: flow 7s linear infinite; }
@keyframes flow { 0% { stroke-dashoffset: 760; } 38%, 62% { stroke-dashoffset: 0; } 78%, 100% { stroke-dashoffset: -760; } }
.packet { animation: packet 7s linear infinite; }
@keyframes packet { 0% { transform: translateX(0); opacity: 0; } 3% { opacity: 1; } 38% { transform: translateX(760px); opacity: 1; } 46%, 100% { transform: translateX(760px); opacity: 0; } }
.a { animation: a 7s infinite; } .b { animation: b 7s infinite; opacity: 0; }
@keyframes a { 0%, 34% { opacity: 1; } 40%, 92% { opacity: 0; } 100% { opacity: 1; } }
@keyframes b { 0%, 36% { opacity: 0; } 42%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
.n1 .lit { animation-delay: 0.10s; } .n2 .lit { animation-delay: 0.52s; } .n3 .lit { animation-delay: 0.94s; } .n4 .lit { animation-delay: 1.36s; } .n5 .lit { animation-delay: 1.78s; } .n6 .lit { animation-delay: 2.20s; } 
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="958" height="268" rx="18" fill="url(#bg)" stroke="rgba(197,204,158,.18)"/>
<line x1="100" y1="70" x2="860" y2="70" stroke="rgba(197,204,158,.14)" stroke-width="2"/>
<line class="flow" x1="100" y1="70" x2="860" y2="70" stroke="url(#wire)" stroke-width="2.5"/>
<circle class="packet" cx="100" cy="70" r="12" fill="url(#gw)"/>
<g class="n1"><circle cx="100" cy="70" r="28" fill="#1d1f17" stroke="rgba(197,204,158,.32)" stroke-width="1.5"/><circle class="lit" cx="100" cy="70" r="28"/>
<text x="100.0" y="75.0" font-family="TSMB" font-size="14" fill="#c5cc9e" text-anchor="middle">01</text>
<text x="100.0" y="128.0" font-family="TSB" font-size="16" fill="#f1f2e8" text-anchor="middle" letter-spacing="-0.2">App opens</text>
<text x="100.0" y="148.0" font-family="TSI" font-size="12.5" fill="#9a9e8c" text-anchor="middle">UsageStats polled</text>
<text x="100.0" y="164.0" font-family="TSI" font-size="12.5" fill="#9a9e8c" text-anchor="middle">every 900 ms</text>
</g>
<g class="n2"><circle cx="252" cy="70" r="28" fill="#1d1f17" stroke="rgba(197,204,158,.32)" stroke-width="1.5"/><circle class="lit" cx="252" cy="70" r="28"/>
<text x="252.0" y="75.0" font-family="TSMB" font-size="14" fill="#c5cc9e" text-anchor="middle">02</text>
<text x="252.0" y="128.0" font-family="TSB" font-size="16" fill="#f1f2e8" text-anchor="middle" letter-spacing="-0.2">Essential?</text>
<text x="252.0" y="148.0" font-family="TSI" font-size="12.5" fill="#9a9e8c" text-anchor="middle">dialer, SMS, maps</text>
<text x="252.0" y="164.0" font-family="TSI" font-size="12.5" fill="#9a9e8c" text-anchor="middle">always pass</text>
</g>
<g class="n3"><circle cx="404" cy="70" r="28" fill="#1d1f17" stroke="rgba(197,204,158,.32)" stroke-width="1.5"/><circle class="lit" cx="404" cy="70" r="28"/>
<text x="404.0" y="75.0" font-family="TSMB" font-size="14" fill="#c5cc9e" text-anchor="middle">03</text>
<text x="404.0" y="128.0" font-family="TSB" font-size="16" fill="#f1f2e8" text-anchor="middle" letter-spacing="-0.2">Your rules</text>
<text x="404.0" y="148.0" font-family="TSI" font-size="12.5" fill="#9a9e8c" text-anchor="middle">target, snooze</text>
<text x="404.0" y="164.0" font-family="TSI" font-size="12.5" fill="#9a9e8c" text-anchor="middle">and session budget</text>
</g>
<g class="n4"><circle cx="556" cy="70" r="28" fill="#1d1f17" stroke="rgba(197,204,158,.32)" stroke-width="1.5"/><circle class="lit" cx="556" cy="70" r="28"/>
<text x="556.0" y="75.0" font-family="TSMB" font-size="14" fill="#c5cc9e" text-anchor="middle">04</text>
<text x="556.0" y="128.0" font-family="TSB" font-size="16" fill="#f1f2e8" text-anchor="middle" letter-spacing="-0.2">OverlayGate</text>
<text x="556.0" y="148.0" font-family="TSI" font-size="12.5" fill="#9a9e8c" text-anchor="middle">1 s monotonic</text>
<text x="556.0" y="164.0" font-family="TSI" font-size="12.5" fill="#9a9e8c" text-anchor="middle">cooldown per app</text>
</g>
<g class="n5"><circle cx="708" cy="70" r="28" fill="#1d1f17" stroke="rgba(197,204,158,.32)" stroke-width="1.5"/><circle class="lit" cx="708" cy="70" r="28"/>
<text x="708.0" y="75.0" font-family="TSMB" font-size="14" fill="#c5cc9e" text-anchor="middle">05</text>
<text x="708.0" y="128.0" font-family="TSB" font-size="16" fill="#f1f2e8" text-anchor="middle" letter-spacing="-0.2">PauseRules</text>
<text x="708.0" y="148.0" font-family="TSI" font-size="12.5" fill="#9a9e8c" text-anchor="middle">base + 5 s × repeats,</text>
<text x="708.0" y="164.0" font-family="TSI" font-size="12.5" fill="#9a9e8c" text-anchor="middle">capped at 30 s</text>
</g>
<g class="n6"><circle class="breath" cx="860" cy="70" r="28" fill="rgba(197,204,158,.16)"/><circle cx="860" cy="70" r="28" fill="#1d1f17" stroke="rgba(197,204,158,.32)" stroke-width="1.5"/><circle class="lit" cx="860" cy="70" r="28" style="stroke:#f1f2e8"/>
<text x="860.0" y="75.0" font-family="TSMB" font-size="14" fill="#c5cc9e" text-anchor="middle">06</text>
<text x="860.0" y="128.0" font-family="TSB" font-size="16" fill="#f1f2e8" text-anchor="middle" letter-spacing="-0.2">Breathe</text>
<text x="860.0" y="148.0" font-family="TSI" font-size="12.5" fill="#9a9e8c" text-anchor="middle">pause screen,</text>
<text x="860.0" y="164.0" font-family="TSI" font-size="12.5" fill="#9a9e8c" text-anchor="middle">closing is one tap</text>
</g>
<rect x="40" y="198" width="880" height="46" rx="10" fill="rgba(0,0,0,.28)" stroke="rgba(197,204,158,.3)" stroke-dasharray="4 5"/>
<text x="480.0" y="227.0" font-family="TSM" font-size="14.5" fill="#9a9e8c" text-anchor="middle" class="a">Instagram · 3rd open this hour · on autopilot</text>
<text x="480" y="227" text-anchor="middle" font-family="TSM" font-size="14.5" fill="#f1f2e8" class="b">8 s + 5 s × 2 = <tspan font-family="TSMB" fill="#c5cc9e">18 s</tspan> to breathe · then close, or pick 5 · 10 · 15 min</text>
</svg>
