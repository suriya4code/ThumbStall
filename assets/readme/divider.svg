<svg xmlns="http://www.w3.org/2000/svg" width="960" height="36" viewBox="0 0 960 36" role="img" aria-label="divider">
<title>divider</title>
<defs><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#c5cc9e" stop-opacity="0"/><stop offset=".5" stop-color="#c5cc9e" stop-opacity=".5"/><stop offset="1" stop-color="#c5cc9e" stop-opacity="0"/></linearGradient><radialGradient id="dot"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#c5cc9e"/><stop offset="1" stop-color="#c5cc9e" stop-opacity="0"/></radialGradient></defs>
<style>

.pl { animation: pl 5s linear infinite; } @keyframes pl { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(380px); opacity: 0; } }.pr { animation: pr 5s linear infinite; } @keyframes pr { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(-380px); opacity: 0; } }
.spin { transform-box: view-box; animation: spin 9s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 35%, 100% { transform: rotate(360deg); } }
.arc { animation: arc 9s ease-in-out infinite; }
@keyframes arc { 0% { stroke-dasharray: 0 100; } 35% { stroke-dasharray: 0 100; } 90%, 100% { stroke-dasharray: 100 100; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
