<svg xmlns="http://www.w3.org/2000/svg" width="960" height="132" viewBox="0 0 960 132" role="img" aria-label="Olive, cream and a lot of  quiet.">
<title>Olive, cream and a lot of  quiet.</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1c15"/><stop offset="1" stop-color="#13140f"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#5a6b2e" stop-opacity=".45"/><stop offset="1" stop-color="#5a6b2e" stop-opacity="0"/></radialGradient><linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c5cc9e"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#c5cc9e"/><animate attributeName="x1" values="-1;0;-1" dur="7s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1.6;0" dur="7s" repeatCount="indefinite"/></linearGradient></defs>
<style>
@font-face{font-family:TSMB;src:url(data:font/woff2;base64,) format('woff2');font-weight:700;}
@font-face{font-family:TSB;src:url(data:font/woff2;base64,) format('woff2');font-weight:800;}

.spin { transform-box: view-box; animation: spin 9s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 35%, 100% { transform: rotate(360deg); } }
.arc { animation: arc 9s ease-in-out infinite; }
@keyframes arc { 0% { stroke-dasharray: 0 100; } 35% { stroke-dasharray: 0 100; } 90%, 100% { stroke-dasharray: 100 100; } }


.k { animation: k 9s ease-in-out infinite; }
@keyframes k { 0% { opacity: 0; transform: translateX(-8px); } 8%, 100% { opacity: 1; transform: none; } }
.line { stroke-dasharray: 34; stroke-dashoffset: 0; animation: ln 9s ease-out infinite; }
@keyframes ln { 0% { stroke-dashoffset: 34; } 10%, 100% { stroke-dashoffset: 0; } }
.sheen { animation: sheen 6s ease-in-out infinite alternate; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="958" height="130" rx="18" fill="url(#bg)" stroke="rgba(197,204,158,.18)"/>
<circle cx="880" cy="66" r="140" fill="url(#glow)"/>
<line x1="40" y1="44" x2="74" y2="44" stroke="#c5cc9e" stroke-width="1.6" class="line"/>
<text x="86.0" y="48.5" font-family="TSMB" font-size="12.5" fill="#c5cc9e" letter-spacing="2.6" class="k">DESIGNED TO BE CALM</text>
<text x="40" y="94" font-family="TSB" font-size="38" letter-spacing="-0.8" fill="#f1f2e8"><tspan fill="#f1f2e8">Olive, cream and a lot of </tspan><tspan fill="url(#hl)">quiet.</tspan></text>
