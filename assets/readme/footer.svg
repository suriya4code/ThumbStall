<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img" aria-label="ThumbStall. Pause the reel. Play your life!">
<title>ThumbStall. Pause the reel. Play your life!</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1c15"/><stop offset="1" stop-color="#13140f"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#5a6b2e" stop-opacity=".45"/><stop offset="1" stop-color="#5a6b2e" stop-opacity="0"/></radialGradient></defs>
<style>
@font-face{font-family:TSB;src:url(data:font/woff2;base64,) format('woff2');font-weight:800;}
@font-face{font-family:TSI;src:url(data:font/woff2;base64,) format('woff2');font-weight:400;}

.spin { transform-box: view-box; animation: spin 9s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 35%, 100% { transform: rotate(360deg); } }
.arc { animation: arc 9s ease-in-out infinite; }
@keyframes arc { 0% { stroke-dasharray: 0 100; } 35% { stroke-dasharray: 0 100; } 90%, 100% { stroke-dasharray: 100 100; } }

.bth { transform-box: fill-box; transform-origin: center; animation: bth 8s ease-in-out infinite; }
@keyframes bth { 0%, 100% { transform: scale(1); opacity: .25; } 50% { transform: scale(1.5); opacity: .05; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="958" height="198" rx="18" fill="url(#bg)" stroke="rgba(197,204,158,.18)"/>
<circle cx="480" cy="70" r="170" fill="url(#glow)"/>
<circle cx="480" cy="68" r="40" fill="#c5cc9e" class="bth"/>
